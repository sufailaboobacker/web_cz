<title>Cozmo Travel — Your Trusted Travel Company</title>
<style>
  :root {
    --brand-blue: #1a73e8;
    --brand-blue-hover: #155ec4;
    --ink: #202124;
    --white: #ffffff;
    --header-height: 84px;
    --container-max: 1760px;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .container {
    width: 100%;
    max-width: var(--container-max);
    margin: 0 auto;
    padding: 0 40px;
  }

  /* Header */
  .site-header { position: absolute; inset: 0 0 auto 0; z-index: 20; background: var(--white); }
  .header-inner {
    height: var(--header-height);
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .brand {
    display: inline-flex; align-items: flex-start;
    font-weight: 800; font-size: 30px; letter-spacing: -0.5px; line-height: 1;
  }
  .brand-cozmo { color: var(--brand-blue); }
  .brand-travel { color: #5f6368; font-weight: 500; }
  .brand-reg { font-size: 11px; color: #5f6368; margin-left: 2px; margin-top: 2px; }

  .main-nav { display: flex; align-items: center; gap: 48px; }
  .nav-list { display: flex; align-items: center; gap: 40px; list-style: none; }
  .nav-link {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 17px; font-weight: 500; color: var(--ink); transition: color 0.15s ease;
  }
  .nav-link:hover { color: var(--brand-blue); }
  .chev { transition: transform 0.2s ease; }
  .nav-link:hover .chev { transform: translateY(1px); }
  .nav-actions { display: flex; align-items: center; gap: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; padding: 11px 22px; border-radius: var(--radius);
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; white-space: nowrap;
  }
  .btn-primary { background: var(--brand-blue); color: var(--white); }
  .btn-primary:hover { background: var(--brand-blue-hover); }
  .btn-outline { border: 1.5px solid var(--brand-blue); color: var(--brand-blue); }
  .btn-outline:hover { background: rgba(26, 115, 232, 0.08); }

  .nav-toggle { display: none; flex-direction: column; gap: 5px; padding: 6px; }
  .nav-toggle span { display: block; width: 26px; height: 2.5px; background: var(--ink); border-radius: 2px; }

  /* Hero */
  .hero {
    position: relative; min-height: 100vh; padding-top: var(--header-height);
    display: flex; align-items: flex-end; overflow: hidden;
  }

    background-size: cover; background-position: center 30%; z-index: 0;
  }
  .hero-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,0.18) 70%, rgba(0,0,0,0.45) 100%);
  }
  .hero-content { position: relative; z-index: 2; padding-bottom: 72px; color: var(--white); }
  .hero-eyebrow { font-size: 30px; font-weight: 400; margin-bottom: 8px; text-shadow: 0 1px 12px rgba(0,0,0,0.35); }
  .hero-title {
    font-size: clamp(56px, 10vw, 168px); line-height: 0.95; font-weight: 800;
    letter-spacing: -2px; text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }

  @media (max-width: 1024px) {
    .container { padding: 0 24px; }
    .nav-list { gap: 26px; }
    .main-nav { gap: 28px; }
    .nav-link { font-size: 16px; }
  }
  @media (max-width: 860px) {
    :root { --header-height: 72px; }
    .nav-toggle { display: flex; }
    .main-nav {
      position: absolute; top: var(--header-height); left: 0; right: 0;
      flex-direction: column; align-items: stretch; gap: 0; background: var(--white);
      padding: 8px 24px 24px; box-shadow: 0 12px 24px rgba(0,0,0,0.12);
      transform: translateY(-8px); opacity: 0; pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .main-nav.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .nav-list { flex-direction: column; align-items: stretch; gap: 0; }
    .nav-item { border-bottom: 1px solid #eee; }
    .nav-link { width: 100%; justify-content: space-between; padding: 16px 0; }
    .nav-actions { flex-direction: column; align-items: stretch; gap: 12px; margin-top: 20px; }
    .btn { width: 100%; padding: 13px 22px; }
    .hero-content { padding-bottom: 48px; }
    .hero-eyebrow { font-size: 22px; }
  }
  @media (max-width: 480px) {
    .brand { font-size: 26px; }
    .hero-title { letter-spacing: -1px; }
  }
</style>

<header class="site-header">
  <div class="container header-inner">
    <a href="#" class="brand" aria-label="Cozmo Travel home">
      <span class="brand-cozmo">cozmo</span><span class="brand-travel">travel</span><sup class="brand-reg">&reg;</sup>
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" aria-label="Primary">
      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-link">Solutions <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </li>
        <li class="nav-item">
          <button class="nav-link">Advertising <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </li>
        <li class="nav-item">
          <button class="nav-link">Affiliates <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </li>
        <li class="nav-item">
          <button class="nav-link">About us <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </li>
      </ul>

      <div class="nav-actions">
        <a href="#" class="btn btn-primary">Become a partner</a>
        <a href="#" class="btn btn-outline">Login</a>
      </div>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-media" role="img" aria-label="A traveller on a Parisian balcony overlooking the Eiffel Tower"></div>
  <div class="hero-overlay"></div>

  <div class="container hero-content">
    <p class="hero-eyebrow">Looking for ur</p>
    <h1 class="hero-title">Your Trusted<br />Travel Company</h1>
  </div>
</section>

<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.querySelector('.main-nav');
    if (!toggle || !nav) return;
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
