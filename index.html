<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cozmo Travel — your trusted travel company. Solutions, advertising and affiliate partnerships for the modern traveller." />
  <title>Cozmo Travel — Your Trusted Travel Company</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Header / Navigation ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand" aria-label="Cozmo Travel home">
        <span class="brand-cozmo">cozmo</span><span class="brand-travel">travel</span><sup class="brand-reg">&reg;</sup>
      </a>

      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" aria-label="Primary">
        <ul class="nav-list">
          <li class="nav-item">
            <button class="nav-link">Solutions <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </li>
          <li class="nav-item">
            <button class="nav-link">Advertising <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </li>
          <li class="nav-item">
            <button class="nav-link">Affiliates <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </li>
          <li class="nav-item">
            <button class="nav-link">About us <svg class="chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </li>
        </ul>

        <div class="nav-actions">
          <a href="#" class="btn btn-primary">Become a partner</a>
          <a href="#" class="btn btn-outline">Login</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero">
    <div class="hero-media" role="img" aria-label="A traveller on a Parisian balcony overlooking the Eiffel Tower"></div>
    <div class="hero-overlay"></div>

    <div class="container hero-content">
      <p class="hero-eyebrow">Looking for ur</p>
      <h1 class="hero-title">Your Trusted<br />Travel Company</h1>
    </div>
  </section>

  <script>
    // Mobile navigation toggle
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var nav = document.querySelector('.main-nav');
      if (!toggle || !nav) return;
      toggle.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
