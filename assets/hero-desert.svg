<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Lone hiker on sand dunes at sunrise with mountains and sun flare">
  <defs>
    <linearGradient id="d-sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#8fb4d6"/>
      <stop offset="45%" stop-color="#afc9df"/>
      <stop offset="78%" stop-color="#dfe4e0"/>
      <stop offset="100%" stop-color="#f3e9d4"/>
    </linearGradient>
    <radialGradient id="d-sun" cx="82%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#fffdf4" stop-opacity="1"/>
      <stop offset="14%" stop-color="#fff4d6" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#f6d9a2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f6d9a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-dune-front" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#c99a5b"/>
      <stop offset="55%" stop-color="#8a6a3f"/>
      <stop offset="100%" stop-color="#3f3222"/>
    </linearGradient>
    <linearGradient id="d-dune-shadow" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#2b2a2c"/>
      <stop offset="100%" stop-color="#4a4436"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1200" fill="url(#d-sky)"/>

  <!-- Far mountain range (hazy) -->
  <path fill="#7f8ea3" opacity="0.55" d="M0 560 L120 500 L230 540 L340 470 L430 520 L560 460 L680 520 L820 500 L980 540 L1120 500 L1260 470 L1420 520 L1560 480 L1720 520 L1920 500 L1920 640 L0 640 Z"/>

  <!-- Near mountain range (dark, jagged) -->
  <path fill="#3a3f4c" d="M0 600
    L90 560 L150 590 L210 500 L260 560 L330 430 L380 540 L440 500 L520 560 L600 520
    L700 560 L760 540 L840 575 L940 545 L1040 570 L1130 540 L1220 500 L1280 545
    L1360 470 L1420 520 L1500 440 L1560 520 L1640 480 L1720 540 L1820 510 L1920 545
    L1920 720 L0 720 Z"/>

  <!-- Sun glow (behind flare, over horizon on the right) -->
  <rect width="1920" height="1200" fill="url(#d-sun)"/>

  <!-- Sun core + starburst -->
  <g transform="translate(1590,560)">
    <circle r="26" fill="#fffef8"/>
    <g stroke="#fff6dd" stroke-width="3" opacity="0.8">
      <line x1="-90" y1="0" x2="90" y2="0"/>
      <line x1="0" y1="-90" x2="0" y2="90"/>
      <line x1="-64" y1="-64" x2="64" y2="64"/>
      <line x1="-64" y1="64" x2="64" y2="-64"/>
    </g>
  </g>

  <!-- Lens-flare orbs trailing down-left -->
  <g opacity="0.55">
    <circle cx="1470" cy="640" r="26" fill="#8fd07a" opacity="0.35"/>
    <circle cx="1360" cy="700" r="16" fill="#f2b26b" opacity="0.4"/>
    <circle cx="1250" cy="760" r="34" fill="#7fbf9a" opacity="0.22"/>
    <circle cx="1130" cy="820" r="12" fill="#ffd9a0" opacity="0.4"/>
  </g>

  <!-- Mid dune band (shadowed) -->
  <path fill="url(#d-dune-shadow)" d="M0 720 Q480 680 960 730 T1920 720 L1920 1000 L0 1000 Z"/>

  <!-- Foreground dune (sunlit ridge to shadow) -->
  <path fill="url(#d-dune-front)" d="M0 980 Q300 860 640 940 Q1000 1030 1920 900 L1920 1200 L0 1200 Z"/>

  <!-- Warm sunlit crest highlight on the near dune -->
  <path fill="#e6b877" opacity="0.5" d="M0 980 Q300 862 640 942 Q660 950 640 958 Q300 882 0 998 Z"/>

  <!-- Lone hiker on the lower-left ridge -->
  <g transform="translate(300,1020)" fill="#241a12">
    <ellipse cx="0" cy="64" rx="26" ry="5" opacity="0.35"/>
    <rect x="-9" y="-34" width="9" height="20" rx="4"/>            <!-- backpack -->
    <circle cx="2" cy="-40" r="6"/>                                <!-- head -->
    <path d="M-2 -34 q7 2 8 12 l-2 24 -6 0 -1 -16 -3 16 -6 0 2 -30 q3 -6 8 -6 z"/>
  </g>
</svg>
